name: Optimizer
on: workflow_dispatch
jobs:
  Job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: latest

      - name: Install OxiPNG & OptiVorbis
        run: |
          cargo install oxipng
          # the OptiVorbis command-line tool isn't on crates.io, only on GitHub
          cargo install --git https://github.com/OptiVorbis/OptiVorbis optivorbis_cli

      - name: Optimizer
        run: |
          haxelib install hxcpp --quiet
          cd actions/optimizer
          haxe -cp ./ -cpp export -D analyzer-optimize -main AssetsOptimizer
          export/AssetsOptimizer ../../assets

      - name: Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: optimizedAssets
          path: assets
          if-no-files-found: error